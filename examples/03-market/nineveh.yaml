# What Studio will have written for you, once you've pasted the market's address and
# ticked its events and tables. It is here to read, not to paste: Studio owns this file,
# and its Settings page shows you the real one to keep in version control.
#
# `0xMARKET` is wherever you published the contract, and the network is wherever you
# published it to. The tables below are copies of what the contract holds; the totals it
# doesn't hold are in `market.nineveh.ts`, next to this file.
name: market
network: testnet
start_version: auto
reducers: ./market.nineveh.ts

sources:
  listed:    { event: "0xMARKET::market::Listed" }
  sold:      { event: "0xMARKET::market::Sold" }
  cancelled: { event: "0xMARKET::market::Cancelled" }
  listings:  { table: "0xMARKET::market::Market.listings" }
  credits:   { table: "0xMARKET::market::Market.credits" }

state:
  # What's for sale right now: rows appear on list and disappear on buy or cancel.
  open_listings: { mirror: listings }
  # Everyone's credits.
  balances: { mirror: credits }
  # Every sale, in order.
  sales: { log: sold }
