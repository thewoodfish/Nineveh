[package]
name = "nineveh-api"
description = "Nineveh's state API: REST over a project's state tables, generated from its config. Reads state only, never the chain."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
axum.workspace = true
nineveh-config.workspace = true
nineveh-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true

[dev-dependencies]
nineveh-engine.workspace = true
nineveh-store.workspace = true
nineveh-testkit.workspace = true
tower.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net"] }

[lints]
workspace = true
