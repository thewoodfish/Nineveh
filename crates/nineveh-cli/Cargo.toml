nineveh-config.workspace = true
nineveh-control.workspace = true
nineveh-core.workspace = true
nineveh-decode.workspace = true
nineveh-realtime.workspace = true
nineveh-store.workspace = true
secrecy.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
nineveh-testkit.workspace = true

[lints]
workspace = true
