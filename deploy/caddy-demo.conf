# /etc/systemd/system/caddy.service.d/demo.conf
#
# Caddy substitutes {$NODE_API_KEY} from its own environment when it loads the
# Caddyfile, so the key has to be here rather than in nineveh.env, which only the
# Nineveh service reads. Without it the Aptos proxy forwards an empty bearer token and
# quietly falls back to the anonymous rate limit.

[Service]
EnvironmentFile=/etc/nineveh/demo.env
