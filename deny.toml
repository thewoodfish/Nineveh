# cargo-deny: supply-chain policy. Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # ruint shift overflow flags (fixed in 1.20.0, which needs Rust 1.90; MSRV is 1.89).
  # Not reachable here: the only shift on a Move integer is `U256::MAX.wrapping_shr(1)`
  # in nineveh-core, far below the 2^32 shift amounts that truncate, and the
  # formatting hang needs a no-alloc build of a non-limb-aligned width, while Nineveh
  # uses std and 256 bits. Drop this when the MSRV reaches 1.90 and ruint is bumped.
  { id = "RUSTSEC-2026-0220", reason = "unreachable: no affected shifts; std build of U256 only" },
]

[licenses]
version = 2
# Permissive licenses compatible with shipping Nineveh under Apache-2.0.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Internal path dependencies carry no version; that's not a wildcard risk.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
